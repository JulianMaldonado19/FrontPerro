<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Perros - API</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Gestión de Perros</h1>
            <p>Interfaz conectada a Node.js + Express + MongoDB</p>
        </header>

        <section class="form-card">
            <h2 id="form-title">Nuevo Perro</h2>
            <form id="perro-form">
                <input type="hidden" id="perro-id">
                
                <div class="form-grid">
                    <div class="input-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" placeholder="Ej. Max" required>
                    </div>

                    <div class="input-group">
                        <label for="edad">Edad (años)</label>
                        <input type="number" id="edad" min="0" max="30" placeholder="Ej. 3" required>
                    </div>

                    <div class="input-group">
                        <label for="tamano">Tamaño</label>
                        <select id="tamano" required>
                            <option value="" disabled selected>Selecciona un tamaño</option>
                            <option value="pequeño">Pequeño</option>
                            <option value="mediano">Mediano</option>
                            <option value="grande">Grande</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="raza">Raza</label>
                        <input type="text" id="raza" placeholder="Ej. Labrador" required>
                    </div>
                </div>

                <div class="btn-group">
                    <button type="submit" id="btn-submit" class="btn-primary">Guardar</button>
                    <button type="button" id="btn-cancel" class="btn-secondary hidden">Cancelar</button>
                </div>
            </form>
        </section>

        <section class="list-section">
            <h2>Listado en Base de Datos</h2>
            <div id="status-message" class="status"></div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Edad</th>
                            <th>Tamaño</th>
                            <th>Raza</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="perros-table-body">
                        <!-- Los datos se cargan dinámicamente con JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
